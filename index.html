<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Dream Cafe</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f5f0ea;
            color:#333;
        }

        header{
            background:linear-gradient(135deg,#6f4e37,#3e2723);
            color:white;
            padding:40px;
            text-align:center;
        }

        header h1{
            font-size:50px;
            margin-bottom:10px;
        }

        header p{
            font-size:20px;
            opacity:0.9;
        }

        nav{
            background:#4e342e;
            padding:15px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-size:18px;
            transition:0.3s;
        }

        nav a:hover{
            color:#ffd54f;
        }

        .hero{
            height:400px;
            background:url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=1600&auto=format&fit=crop') center/cover;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            text-shadow:2px 2px 5px black;
            font-size:40px;
            font-weight:bold;
        }

        .menu{
            padding:50px 20px;
            text-align:center;
        }

        .menu h2{
            margin-bottom:30px;
            font-size:40px;
            color:#5d4037;
        }

        .cards{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
        }

        .card{
            background:white;
            width:260px;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .card h3{
            margin:15px 0;
        }

        .price{
            color:#6f4e37;
            font-size:22px;
            margin-bottom:15px;
            font-weight:bold;
        }

        button{
            margin-bottom:20px;
            padding:10px 20px;
            border:none;
            background:#6f4e37;
            color:white;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#3e2723;
        }

        footer{
            background:#3e2723;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>
<body>

<header>
    <h1>☕ Coffee Dream Cafe</h1>
    <p>Лучшее кафе для настоящих любителей кофе</p>
</header>

<nav>
    <a href="#">Главная</a>
    <a href="#">Меню</a>
    <a href="#">О нас</a>
    <a href="#">Контакты</a>
</nav>

<div class="hero">
    Добро пожаловать в Coffee Dream ☕
</div>

<section class="menu">
    <h2>📋 Наше меню</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=1200&auto=format&fit=crop">
            <h3>Капучино</h3>
            <p class="price">150 сом</p>
            <button>Заказать</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop">
            <h3>Чизкейк</h3>
            <p class="price">220 сом</p>
            <button>Заказать</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?q=80&w=1200&auto=format&fit=crop">
            <h3>Латте</h3>
            <p class="price">170 сом</p>
            <button>Заказать</button>
        </div>

    </div>
</section>

<footer>
    © 2026 Coffee Dream Cafe | Сделано для GitHub 🚀
</footer>

</body>
</html>
